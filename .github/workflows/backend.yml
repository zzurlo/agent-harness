name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "scripts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "scripts/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy with mandatory runtime checks, or verify the existing deployment only"
        type: choice
        options: [deploy, verify]
        default: deploy
        required: true

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-agent-harness
  CONTAINER_APP: ca-agentharness-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: python -m pip install -e ".[dev]" pyyaml
      - name: Deployment helper regressions (no Azure access or Bicep compiler)
        run: python -m pytest tests -q --ignore=tests/test_infra_registries.py
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test
        working-directory: backend
        env:
          FOUNDRY_MODEL_ENDPOINT: https://example.openai.azure.com/openai/v1
          FOUNDRY_PROJECT_ENDPOINT: https://example.services.ai.azure.com/api/projects/test
          FOUNDRY_API_KEY: dummy
        run: pytest -q
      - name: Docker build
        working-directory: backend
        run: docker build -t agent-harness-api:ci .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: agent-harness-azure-production
      cancel-in-progress: false
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
      FOUNDRY_MODEL_ENDPOINT: ${{ vars.FOUNDRY_MODEL_ENDPOINT }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      MODEL_FAST: ${{ vars.MODEL_FAST }}
      MODEL_CHAT: ${{ vars.MODEL_CHAT }}
      MODEL_TOOLS: ${{ vars.MODEL_TOOLS }}
      MODEL_THINK: ${{ vars.MODEL_THINK }}
      MODEL_MAX: ${{ vars.MODEL_MAX }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the production verification token
        run: |
          python - <<'PY'
          import os
          token = os.environ.get('APP_ACCESS_TOKEN', '')
          if len(token) < 32 or any(c.isspace() for c in token):
              raise SystemExit('Set APP_ACCESS_TOKEN to a strong random token of at least 32 characters')
          PY
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check bootstrap exists
        run: az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" -o none
      - name: Build image in ACR
        if: inputs.action != 'verify'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$ACR_NAME" || { echo 'Set the ACR_NAME repository variable after bootstrap'; exit 1; }
          az acr build --registry "$ACR_NAME" --image "agent-harness-api:$IMAGE_TAG" ./backend -o none
      - name: Bind system identity and deploy real image on port 8000
        if: inputs.action != 'verify'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python scripts/deploy.py backend --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/agent-harness-api:$IMAGE_TAG"
      - name: Mandatory health, auth gate and runtime model verification
        run: |
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          python scripts/verify_deployment.py --url "https://$FQDN" --model-timeout 180
