name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths: ["infra/**", "scripts/**", "tests/**", ".github/workflows/**"]
  pull_request:
    paths: ["infra/**", "scripts/**", "tests/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "Read-only what-if by default; deploy explicitly provisions/updates resources"
        type: choice
        options: [what-if, deploy]
        default: what-if
        required: true
      location:
        description: "Azure region (use the existing region on reruns)"
        default: centralus
        required: true

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-agent-harness

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - name: Infrastructure orchestration regressions (no Azure access)
        run: python -m pytest tests -q
      - name: Compile and lint Bicep (no Azure access)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile /tmp/main.json
          az bicep lint --file infra/main.bicep

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: agent-harness-azure-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: State-preserving infrastructure what-if or deploy
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          DEPLOY_LOCATION: ${{ inputs.location }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          FOUNDRY_MODEL_ENDPOINT: ${{ vars.FOUNDRY_MODEL_ENDPOINT }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          MODEL_FAST: ${{ vars.MODEL_FAST }}
          MODEL_CHAT: ${{ vars.MODEL_CHAT }}
          MODEL_TOOLS: ${{ vars.MODEL_TOOLS }}
          MODEL_THINK: ${{ vars.MODEL_THINK }}
          MODEL_MAX: ${{ vars.MODEL_MAX }}
        run: |
          python scripts/deploy.py infra --action "$DEPLOY_ACTION" \
            --resource-group "$RESOURCE_GROUP" --location "$DEPLOY_LOCATION"
