name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build with public API origin only (never an access token)
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: agent-harness-swa-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require production configuration
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          test -n "$SWA_TOKEN" || { echo 'Set AZURE_STATIC_WEB_APPS_API_TOKEN after bootstrap'; exit 1; }
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ.get('VITE_API_BASE', ''))
          if (url.scheme != 'https' or not url.hostname or url.username or url.password
              or url.query or url.fragment or url.path not in ('', '/')):
              raise SystemExit('VITE_API_BASE must be a public HTTPS API origin only')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Deploy prebuilt dist to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "frontend/dist"
          output_location: ""
          skip_app_build: true
