name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Always runs -- proves the app compiles even with no Azure secrets.
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  deploy:
    needs: build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for deployment token
        id: pre
        run: |
          if [ -n "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Frontend deploy skipped"
              echo ""
              echo "\`AZURE_STATIC_WEB_APPS_API_TOKEN\` is not set."
              echo "The build succeeded and the artifact was uploaded."
              echo ""
              echo "Provision infra, then:"
              echo ""
              echo '\`\`\`bash'
              echo "az staticwebapp secrets list -n swa-agentharness \\"
              echo "  -g rg-agent-harness --query properties.apiKey -o tsv"
              echo '\`\`\`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/download-artifact@v4
        if: steps.pre.outputs.ready == 'true'
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Static Web Apps
        if: steps.pre.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "frontend"
          output_location: "dist"
          skip_app_build: true
          skip_deploy_on_missing_secrets: true

  close_pr:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close staging environment
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          skip_deploy_on_missing_secrets: true
