[project]
name = "agent-harness"
version = "0.1.0"
description = "A ChatGPT-style agent harness on Microsoft Foundry models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.54",
    "azure-identity>=1.19",
    "azure-data-tables>=12.5",
    "httpx>=0.27",
    "pydantic>=2.9",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]
# Microsoft Agent Framework -- optional adapter path, see harness/providers/
agentframework = ["agent-framework>=1.0.0b1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly so local runs and CI agree regardless of which
# ruff version is installed -- CI enforces `ruff check` as a hard gate.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"harness/tools/__init__.py" = ["E402"]  # import-for-side-effect is deliberate
"tests/*" = ["F401"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "api*"]
